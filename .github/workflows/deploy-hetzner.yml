name: Deploy to Hetzner (GHCR)

# NOTE: All inputs are trusted (from caller YAML, not user input).
# Do NOT pass untrusted data (PR titles, branch names, etc.) as inputs.

on:
  workflow_call:
    inputs:
      image-name:
        description: 'Docker image name (e.g. nickheymann/kathrin-coaching-tall)'
        required: true
        type: string
      deploy-path:
        description: 'Path on server (e.g. /opt/apps/kathrin-coaching-tall-production)'
        required: true
        type: string
      docker-context:
        description: 'Docker build context path (default: .)'
        required: false
        type: string
        default: '.'
      pre-deploy-commands:
        description: 'Commands to run after pull but before docker compose up (e.g. migrations)'
        required: false
        type: string
        default: ''
      post-deploy-commands:
        description: 'Commands to run after docker compose up (e.g. cache, health check)'
        required: false
        type: string
        default: ''
      extra-deploy-paths:
        description: 'Additional deploy paths (e.g. staging), same image, newline-separated'
        required: false
        type: string
        default: ''
      app-container:
        description: 'App container name for quick deploy (e.g. kathrin-coaching-app). If set, enables quick deploy for view/css/js changes.'
        required: false
        type: string
        default: ''
      public-volume-path:
        description: 'Host path to public volume for quick deploy (e.g. /mnt/HC_Volume.../app-public/_data)'
        required: false
        type: string
        default: ''
      runner:
        description: 'Runner label(s) for build/deploy jobs. Default self-hosted (Hetzner runner, no GitHub Actions minutes). Override to ubuntu-latest only if a repo has no self-hosted runner provisioned.'
        required: false
        type: string
        default: 'self-hosted'

env:
  REGISTRY: ghcr.io

jobs:
  # ── Detect whether a quick deploy is possible ────────────────────────────────
  detect-changes:
    runs-on: ${{ inputs.runner }}
    outputs:
      quick: ${{ steps.check.outputs.quick }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check changed files
        id: check
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD)
          echo "Changed files:"
          echo "$CHANGED"

          # Quick deploy only possible if app-container is configured
          if [ -z "${{ inputs.app-container }}" ]; then
            echo "quick=false" >> "$GITHUB_OUTPUT"
            echo "Quick deploy disabled (no app-container configured)"
            exit 0
          fi

          # Full rebuild required for these file types
          FULL_PATTERN="^(Dockerfile|composer\.(json|lock)|package(-lock)?\.json|vite\.config\.[jt]s|tailwind\.config\.[jt]s|\.github/|app/|config/|database/|routes/|bootstrap/)"

          NEEDS_FULL=false
          while IFS= read -r file; do
            if echo "$file" | grep -qE "$FULL_PATTERN"; then
              NEEDS_FULL=true
              echo "Full build required due to: $file"
              break
            fi
          done <<< "$CHANGED"

          if [ "$NEEDS_FULL" = "false" ]; then
            echo "quick=true" >> "$GITHUB_OUTPUT"
            echo "Quick deploy (views/css/js/public only)"
          else
            echo "quick=false" >> "$GITHUB_OUTPUT"
            echo "Full Docker build required"
          fi

  # ── Quick Deploy: rsync views + assets directly into container ───────────────
  quick-deploy:
    needs: detect-changes
    if: needs.detect-changes.outputs.quick == 'true'
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v4

      # Install PHP + Node inline rather than via shivammathur/setup-php +
      # actions/setup-node: those marketplace actions cannot provision a runtime
      # on the lean self-hosted runner ("Could not setup PHP 8.4"). The runner
      # image is Debian-based, so apt + NodeSource work directly.
      # vendor/ is needed at Vite-build time: app.js imports Livewire+Alpine from
      # vendor/livewire/livewire/dist/livewire.esm.
      - name: Setup PHP + Node + build assets
        run: |
          set -e
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          if ! command -v php >/dev/null 2>&1; then
            apt-get install -y -qq --no-install-recommends \
              php8.4-cli php8.4-xml php8.4-mbstring php8.4-zip php8.4-intl php8.4-bcmath php8.4-curl \
              unzip git curl ca-certificates \
            || apt-get install -y -qq --no-install-recommends php-cli php-xml php-mbstring php-zip php-intl php-bcmath php-curl unzip git curl ca-certificates
          fi
          if ! command -v composer >/dev/null 2>&1; then
            curl -sS https://getcomposer.org/installer -o /tmp/composer-setup.php
            HASH="$(curl -sS https://composer.github.io/installer.sig)"
            php -r "if (hash_file('sha384','/tmp/composer-setup.php') !== '$HASH') { exit(1); }"
            php /tmp/composer-setup.php --install-dir=/usr/local/bin --filename=composer
          fi
          if ! command -v npm >/dev/null 2>&1; then
            curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
            apt-get install -y -qq nodejs
          fi
          php -v | head -1; composer --version; node -v; npm -v
          composer install --no-dev --no-interaction --prefer-dist --no-progress --no-scripts --ignore-platform-reqs
          npm ci && npm run build

      - name: Create staging dir on server
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: 46.224.6.69
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 30s
          command_timeout: 2m
          script: mkdir -p /tmp/quick-deploy/resources/views /tmp/quick-deploy/lang /tmp/quick-deploy/public/build /tmp/quick-deploy/public/images

      - name: Upload views
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -az --delete
          path: resources/views/
          remote_path: /tmp/quick-deploy/resources/views/
          remote_host: 46.224.6.69
          remote_user: root
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}

      # lang/ — translation files (lang/de/*.php, lang/en/*.php). Same class as
      # views: no code, no CMS input, so --delete is safe. Without this, text
      # changes in lang/ are classified as quick-deployable but never reach the
      # container (they only land on the next full image build).
      # Only some projects have a lang/ dir — guard so projects without one
      # (most) don't fail the rsync step on a missing source path.
      - name: Check for lang directory
        id: has-lang
        run: |
          if [ -d lang ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload lang
        if: steps.has-lang.outputs.exists == 'true'
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -az --delete
          path: lang/
          remote_path: /tmp/quick-deploy/lang/
          remote_host: 46.224.6.69
          remote_user: root
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Upload built assets
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -az --delete
          path: public/build/
          remote_path: /tmp/quick-deploy/public/build/
          remote_host: 46.224.6.69
          remote_user: root
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}

      # public/images/ — additive sync (NO --delete: images may also be
      # uploaded via admin/CMS at runtime; we must not wipe those).
      - name: Upload public images
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -az
          path: public/images/
          remote_path: /tmp/quick-deploy/public/images/
          remote_host: 46.224.6.69
          remote_user: root
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Apply + clear caches
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: 46.224.6.69
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 30s
          command_timeout: 5m
          script: |
            set -e
            CONTAINER="${{ inputs.app-container }}"
            VOLUME="${{ inputs.public-volume-path }}"

            docker cp /tmp/quick-deploy/resources/views/. "$CONTAINER":/var/www/resources/views/
            if [ -d /tmp/quick-deploy/lang ]; then
              docker cp /tmp/quick-deploy/lang/. "$CONTAINER":/var/www/lang/
            fi
            if [ -n "$VOLUME" ]; then
              cp -r /tmp/quick-deploy/public/build/. "$VOLUME/build/"
              # public/images/ — additive copy into the public volume so new
              # static images (e.g. /images/about/foo.jpg) reach nginx without
              # a full Docker rebuild. www-data inside the container is uid 82.
              if [ -d /tmp/quick-deploy/public/images ]; then
                mkdir -p "$VOLUME/images"
                cp -r /tmp/quick-deploy/public/images/. "$VOLUME/images/"
                chown -R 82:82 "$VOLUME/images"
                find "$VOLUME/images" -type d -exec chmod 755 {} \;
                find "$VOLUME/images" -type f -exec chmod 644 {} \;
              fi
            fi
            docker exec "$CONTAINER" php artisan view:clear
            docker exec "$CONTAINER" php artisan config:clear
            docker exec "$CONTAINER" php artisan cache:clear

            # OPcache reset — many of our images run with
            # opcache.validate_timestamps=Off, so freshly compiled views
            # would otherwise be ignored until the next container restart.
            # USR2 to PID 1 = PHP-FPM graceful reload (fresh OPcache).
            docker exec --user root "$CONTAINER" kill -USR2 1 || \
              echo "WARN: USR2 failed; consider docker compose restart on next deploy"

            rm -rf /tmp/quick-deploy
            echo "Quick deploy done"

  # ── Full Deploy: Docker build + push + restart ───────────────────────────────
  full-deploy:
    needs: detect-changes
    if: needs.detect-changes.outputs.quick == 'false'
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: nickheymann
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build-Platz holen
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/build-slot.sh" <<'BUILD_SLOT_SCRIPT'
          #!/bin/bash
          # Nach dem Build-Konflikt am 03.10.2026 begrenzen Containernamen parallele Builds.
          # Ein Platz verfällt nach 45 Minuten; beendete Container werden abgeräumt.

          slots=${BUILD_SLOTS:-2}
          prefix=${BUILD_SLOT_PREFIX:-hetzner-build-slot}
          max_wait=${BUILD_SLOT_MAX_WAIT:-2400}
          ttl=${BUILD_SLOT_TTL:-2700}
          owner_run=${GITHUB_RUN_ID:-}-${GITHUB_RUN_ATTEMPT:-}
          owner_job=${GITHUB_JOB:-}

          release() {
              [ -n "${BUILD_SLOT:-}" ] || return 0
              # Nach Prüfung nur die Container-ID löschen, damit ein Nachfolger sicher bleibt.
              info=$(docker inspect --format '{{.Id}} {{index .Config.Labels "run"}} {{index .Config.Labels "job"}}' "$BUILD_SLOT" 2>/dev/null) || return 0
              IFS=' ' read -r container_id run_label job_label <<EOF_INFO
          $info
          EOF_INFO
              if [ "$run_label" = "$owner_run" ] && [ "$job_label" = "$owner_job" ]; then
                  docker rm -f "$container_id" >/dev/null || echo "::warning::Build-Platz $BUILD_SLOT konnte nicht freigegeben werden."
              else
                  echo "Build-Platz $BUILD_SLOT gehört einem anderen Job und bleibt bestehen."
              fi
              return 0
          }

          show_holders() {
              i=1
              while [ "$i" -le "$slots" ]; do
                  holder=$(docker inspect --format '{{index .Config.Labels "repo"}} ({{index .Config.Labels "run"}} / {{index .Config.Labels "job"}})' "$prefix-$i" 2>/dev/null) || holder='frei oder nicht erreichbar'
                  echo "Build-Platz $prefix-$i: $holder"
                  i=$((i + 1))
              done
          }

          acquire() {
              for value in "$slots" "$max_wait" "$ttl"; do
                  case "$value" in
                      ''|*[!0-9]*) echo '::warning::Ungültige Build-Platz-Konfiguration, Build läuft ohne Platz weiter.'; return 0 ;;
                  esac
              done
              if [ "$slots" -eq 0 ] || [ "$ttl" -eq 0 ]; then
                  echo '::warning::Plätze und Verfallszeit müssen positiv sein, Build läuft ohne Platz weiter.'
                  return 0
              fi
              started=$(date +%s)
              next_log=$started
              failures=0
              while :; do
                  slot_index=1
                  while [ "$slot_index" -le "$slots" ]; do
                      slot="$prefix-$slot_index"
                      info=$(docker inspect --format '{{.Id}} {{.State.Running}}' "$slot" 2>/dev/null) || info=''
                      IFS=' ' read -r container_id running <<EOF_INFO
          $info
          EOF_INFO
                      if [ "$running" = 'false' ]; then
                          docker rm -f "$container_id" >/dev/null 2>&1 || echo "Build-Platz $slot wurde inzwischen verändert oder konnte nicht entfernt werden."
                      fi
                      if result=$(docker run -d --name "$slot" \
                          --label "repo=${GITHUB_REPOSITORY:-}" --label "run=$owner_run" \
                          --label "job=$owner_job" --restart no alpine:3.20 sleep "$ttl" 2>&1); then
                          if printf 'BUILD_SLOT=%s\n' "$slot" >> "$GITHUB_ENV"; then
                              echo "Build-Platz $slot übernommen."
                          else
                              BUILD_SLOT=$slot release
                              echo '::warning::Build-Platz konnte nicht gespeichert werden, Build läuft ohne Platz weiter.'
                          fi
                          return 0
                      fi
                      # Namenskonflikte sind normales Warten; Pull-/Daemonfehler zählen separat.
                      case "$result" in
                          *'Conflict.'*|*'is already in use'*) failures=0 ;;
                          *)
                              failures=$((failures + 1))
                              echo "Build-Platz $slot konnte nicht übernommen werden: $result"
                              if [ "$failures" -ge 3 ]; then
                                  echo '::warning::Drei Docker-Fehler in Folge, Build läuft ohne Platz weiter.'
                                  return 0
                              fi
                              ;;
                      esac
                      slot_index=$((slot_index + 1))
                  done
                  now=$(date +%s)
                  elapsed=$((now - started))
                  if [ "$elapsed" -ge "$max_wait" ]; then
                      echo "::warning::Nach $max_wait Sekunden kein Build-Platz frei, Build läuft ohne Platz weiter."
                      return 0
                  fi
                  if [ "$now" -ge "$next_log" ]; then
                      show_holders
                      next_log=$((now + 60))
                  fi
                  delay=$((max_wait - elapsed))
                  [ "$delay" -le 10 ] || delay=10
                  sleep "$delay"
              done
          }

          case "${1:-}" in
              acquire) acquire ;;
              release) release ;;
              *) echo 'Verwendung: build-slot.sh acquire|release' >&2; exit 2 ;;
          esac
          BUILD_SLOT_SCRIPT
          bash "$RUNNER_TEMP/build-slot.sh" acquire

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ inputs.docker-context }}
          push: true
          tags: |
            ghcr.io/${{ inputs.image-name }}:latest
            ghcr.io/${{ inputs.image-name }}:${{ github.sha }}
          # Cache via a per-image GHCR tag, NOT type=gha. On the self-hosted
          # Hetzner runner type=gha round-trips every layer (mode=max) to
          # GitHub's cache service over the public internet — slow, and wasteful
          # since the runner builds on the same host it deploys to. A registry
          # cache tag lives in GHCR (local network for the runner) and is pulled
          # layer-by-layer, so an unchanged base/deps stage is reused instantly.
          cache-from: type=registry,ref=ghcr.io/${{ inputs.image-name }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ inputs.image-name }}:buildcache,mode=max

      - name: Build-Platz freigeben
        if: always()
        shell: bash
        run: |
          if [ -n "${BUILD_SLOT:-}" ] && [ -f "$RUNNER_TEMP/build-slot.sh" ]; then
            bash "$RUNNER_TEMP/build-slot.sh" release
          fi

      - name: Deploy to Hetzner
        uses: appleboy/ssh-action@v1.2.5
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        with:
          host: 46.224.6.69
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GHCR_TOKEN
          timeout: 30s
          command_timeout: 15m
          script: |
            set -euo pipefail

            echo "$GHCR_TOKEN" | docker login ghcr.io -u nickheymann --password-stdin

            cd "${{ inputs.deploy-path }}"
            docker compose pull

            # Pre-deploy commands (e.g. migrations before up)
            ${{ inputs.pre-deploy-commands }}

            docker compose up -d --force-recreate

            # Post-deploy commands (cache, health check, etc.)
            ${{ inputs.post-deploy-commands }}

            # Deploy extra paths (e.g. staging) if specified
            EXTRA_PATHS="${{ inputs.extra-deploy-paths }}"
            if [ -n "$EXTRA_PATHS" ]; then
              echo "$EXTRA_PATHS" | while IFS= read -r path; do
                path=$(echo "$path" | xargs)
                if [ -n "$path" ]; then
                  echo "Deploying to extra path: $path"
                  cd "$path"
                  docker compose pull
                  docker compose up -d --force-recreate
                fi
              done
            fi

            # Cleanup old images (skip recently used to avoid race with concurrent deploys)
            docker image prune -f --filter "until=1h"
