name: Deploy to Hetzner (GHCR)

# NOTE: All inputs are trusted (from caller YAML, not user input).
# Do NOT pass untrusted data (PR titles, branch names, etc.) as inputs.

on:
  workflow_call:
    inputs:
      image-name:
        description: 'Docker image name (e.g. nickheymann/kathrin-coaching-tall)'
        required: true
        type: string
      deploy-path:
        description: 'Path on server (e.g. /opt/apps/kathrin-coaching-tall-production)'
        required: true
        type: string
      docker-context:
        description: 'Docker build context path (default: .)'
        required: false
        type: string
        default: '.'
      pre-deploy-commands:
        description: 'Commands to run after pull but before docker compose up (e.g. migrations)'
        required: false
        type: string
        default: ''
      post-deploy-commands:
        description: 'Commands to run after docker compose up (e.g. cache, health check)'
        required: false
        type: string
        default: ''
      extra-deploy-paths:
        description: 'Additional deploy paths (e.g. staging), same image, newline-separated'
        required: false
        type: string
        default: ''
      app-container:
        description: 'App container name for quick deploy (e.g. kathrin-coaching-app). If set, enables quick deploy for view/css/js changes.'
        required: false
        type: string
        default: ''
      public-volume-path:
        description: 'Host path to public volume for quick deploy (e.g. /mnt/HC_Volume.../app-public/_data)'
        required: false
        type: string
        default: ''
      opcache-reset-url:
        description: 'Optional URL to reset FPM OPcache after a quick deploy (e.g. https://app.example.com/__deploy/opcache-reset). REQUIRED when the container runs opcache.validate_timestamps=Off, otherwise freshly copied Blade views stay stale in FPM until the next container restart. The app must expose a token-guarded route calling opcache_reset(); pass the token via the DEPLOY_TOKEN secret. If empty, only kill -USR2 is attempted.'
        required: false
        type: string
        default: ''
      runner:
        description: 'Runner label(s) for build/deploy jobs. Default self-hosted (Hetzner runner, no GitHub Actions minutes). Override to ubuntu-latest only if a repo has no self-hosted runner provisioned.'
        required: false
        type: string
        default: 'self-hosted'
      stateful-services:
        description: 'Compose-Dienstnamen (Leerzeichen, Komma oder Zeilenumbruch getrennt), die beim Deploy NICHT zwangsweise neu erzeugt werden (Redis, Datenbanken und andere Dienste mit Volume). Sie werden mit einem normalen compose up -d aktualisiert: Compose erzeugt sie nur neu, wenn sich Image oder Konfiguration geaendert haben, sonst laufen sie ohne Unterbrechung weiter. Alle uebrigen Dienste werden wie bisher mit --force-recreate neu erzeugt. Leerer String stellt das alte Verhalten wieder her (alles zwangsweise neu).'
        required: false
        type: string
        default: 'redis valkey keydb memcached postgres postgresql pgsql db database mysql mariadb mongo mongodb rabbitmq minio'
      node-version:
        description: 'Node-Hauptversion (Docker-Tag von node:<version>) fuer den Vite-Build im Quick-Deploy. Der Build laeuft im node-Container und ist damit unabhaengig davon, welches Node/npm das Runner-Image mitbringt.'
        required: false
        type: string
        default: '22'

env:
  REGISTRY: ghcr.io

jobs:
  # ── Detect whether a quick deploy is possible ────────────────────────────────
  detect-changes:
    runs-on: ${{ inputs.runner }}
    outputs:
      quick: ${{ steps.check.outputs.quick }}
      base: ${{ steps.check.outputs.base }}
      stage: ${{ steps.stage.outputs.dir }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # Eindeutiger Name des Staging-Verzeichnisses je Aufruf dieses Workflows (auch bei
      # mehreren parallelen Aufrufen im selben Workflow-Lauf, z. B. Matrix: gleiche run_id).
      - name: Staging name
        id: stage
        run: echo "dir=quick-deploy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$(head -c 6 /dev/urandom | od -An -tx1 | tr -d ' \n')" >> "$GITHUB_OUTPUT"

      # Basis des Quick-Deploys: der zuletzt VOLLSTÄNDIG ausgerollte Commit, vom Ziel
      # selbst gemeldet (Datei <deploy-path>/.quick-deploy-basis, geschrieben erst nach
      # erfolgreichem Ausrollen). Das Diff gegen den Vorgänger-Commit (HEAD~1) verlor
      # Änderungen, wenn ein Lauf abgebrochen wurde (concurrency cancel-in-progress,
      # Handabbruch, Fehlschlag): der Folge-Commit übertrug nur sein eigenes Diff.
      # continue-on-error: ein nicht lesbarer Vermerk führt zum Full-Deploy (fail closed),
      # nicht zu einem roten Lauf.
      - name: Read last deployed basis from server
        id: basis
        if: inputs.app-container != ''
        continue-on-error: true
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: 46.224.6.69
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 30s
          command_timeout: 1m
          capture_stdout: true
          script: |
            BASIS_FILE="${{ inputs.deploy-path }}/.quick-deploy-basis"
            if [ -f "$BASIS_FILE" ]; then
              echo "QUICK_DEPLOY_BASIS=$(head -n 1 "$BASIS_FILE" | tr -d '[:space:]')"
            fi

      - name: Check changed files
        id: check
        env:
          APP_CONTAINER: ${{ inputs.app-container }}
          BASIS_RAW: ${{ steps.basis.outputs.stdout }}
        run: |
          # Quick deploy only possible if app-container is configured
          if [ -z "$APP_CONTAINER" ]; then
            echo "quick=false" >> "$GITHUB_OUTPUT"
            echo "Quick deploy disabled (no app-container configured)"
            exit 0
          fi

          full_deploy() {
            echo "quick=false" >> "$GITHUB_OUTPUT"
            echo "Full Docker build required: $1"
            exit 0
          }

          # Basis = zuletzt vollständig ausgerollter Commit laut Server. Fehlt er, ist er
          # ungültig oder nicht abrufbar, läuft der Full-Deploy (fail closed).
          BASE=$(printf '%s\n' "$BASIS_RAW" | sed -n 's/^QUICK_DEPLOY_BASIS=//p' | tail -n 1 | tr -d '[:space:]')
          if ! printf '%s' "$BASE" | grep -qE '^[0-9a-f]{40}$'; then
            full_deploy "kein gültiger Basis-Vermerk am Server (erster Deploy mit Basis-Prüfung oder Lesefehler)"
          fi
          # Gelesene Basis immer melden (auch wenn danach der Full-Deploy gewählt wird): der
          # Full-Deploy prüft unter der Server-Sperre, dass der Vermerk noch dieser ist.
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$BASE" 2>/dev/null || true
          fi
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            full_deploy "Basis-Commit $BASE nicht abrufbar"
          fi
          # Schutz gegen alte Wiederholungen: ist der zu deployende Commit ein Vorfahr des
          # Basis-Vermerks (oder ein älterer Stand), würde ein Rerun einen neueren, bereits
          # ausgerollten Stand überschreiben. Gilt für Quick UND Full (beide laufen erst nach
          # diesem Schritt). Ist der Stand identisch (Wiederholung desselben Commits), läuft es normal.
          if [ "$BASE" != "$(git rev-parse HEAD)" ]; then
            git fetch --no-tags --unshallow origin 2>/dev/null || git fetch --no-tags origin 2>/dev/null || true
            # Bleibt die Historie flach, ist "kein Vorfahr" nicht belastbar (Gegenbeispiel: alter
            # Commit und Basis durch die flache Grenze getrennt). Dann nicht deployen.
            if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
              echo "::error::Abbruch: Historie konnte nicht vollständig geladen werden, die Prüfung gegen den Basis-Vermerk $BASE ist nicht möglich. Nichts ausgerollt. Lauf wiederholen."
              exit 1
            fi
            if git merge-base --is-ancestor HEAD "$BASE" 2>/dev/null; then ANC=0; else ANC=$?; fi
            if [ "$ANC" -eq 0 ]; then
              echo "::error::Abbruch: Commit $(git rev-parse HEAD) ist älter als der am Ziel ausgerollte Stand $BASE (Vermerk .quick-deploy-basis). Ein alter Lauf (Rerun) würde einen neueren Stand überschreiben. Nichts ausgerollt. Für einen bewussten Rückschritt den Vermerk am Ziel löschen oder einen neuen Revert-Commit pushen."
              exit 1
            elif [ "$ANC" -ne 1 ]; then
              full_deploy "Vorfahren-Prüfung gegen Basis $BASE nicht möglich (Exit $ANC)"
            fi
          fi
          if ! CHANGED=$(git diff --name-only "$BASE" HEAD); then
            full_deploy "Diff gegen Basis $BASE fehlgeschlagen"
          fi
          echo "Basis (zuletzt ausgerollt): $BASE"
          echo "Changed files since basis:"
          echo "$CHANGED"

          # nginx.conf liegt am Server und wird dort von Hand gepflegt: weder Quick- noch
          # Full-Deploy rollen sie aus. Der Lauf meldet das ehrlich, statt sie still als
          # "quick ausgerollt" zu führen.
          if echo "$CHANGED" | grep -qE '(^|/)nginx\.conf$'; then
            MSG="nginx.conf hat sich geändert, wird aber NICHT ausgerollt (am Server von Hand gepflegt). Änderung dort selbst einspielen."
            echo "::warning::$MSG"
            [ -n "${GITHUB_STEP_SUMMARY:-}" ] && echo "**Hinweis:** $MSG" >> "$GITHUB_STEP_SUMMARY"
          fi

          # Full rebuild required for these file types
          FULL_PATTERN="^(Dockerfile|composer\.(json|lock)|package(-lock)?\.json|vite\.config\.[jt]s|tailwind\.config\.[jt]s|\.github/|app/|config/|database/|routes/|bootstrap/)"

          NEEDS_FULL=false
          while IFS= read -r file; do
            if echo "$file" | grep -qE "$FULL_PATTERN"; then
              NEEDS_FULL=true
              echo "Full build required due to: $file"
              break
            fi
          done <<< "$CHANGED"

          if [ "$NEEDS_FULL" = "false" ]; then
            echo "quick=true" >> "$GITHUB_OUTPUT"
            echo "Quick deploy (views/css/js/public only)"
          else
            echo "quick=false" >> "$GITHUB_OUTPUT"
            echo "Full Docker build required"
          fi

  # ── Quick Deploy: rsync views + assets directly into container ───────────────
  quick-deploy:
    needs: detect-changes
    if: needs.detect-changes.outputs.quick == 'true'
    runs-on: ${{ inputs.runner }}
    env:
      # Staging-Verzeichnis am Server je Aufruf (Lauf-ID und Zufallsanteil aus detect-changes)
      # UND je Versuch dieses Jobs: bei "Re-run failed jobs" bleibt der Output von detect-changes
      # erhalten, die aktuelle run_attempt hält den neuen Versuch vom alten getrennt.
      STAGING_DIR: /tmp/${{ needs.detect-changes.outputs.stage }}-a${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4

      # Composer und Node laufen je in einem eigenen Container statt ueber
      # shivammathur/setup-php + actions/setup-node: die Marketplace-Actions
      # koennen auf dem schlanken self-hosted Runner keine Laufzeit bereitstellen
      # ("Could not setup PHP 8.4"), und das Runner-Image selbst ist nicht stabil
      # (siehe unten).
      # vendor/ is needed at Vite-build time: app.js imports Livewire+Alpine from
      # vendor/livewire/livewire/dist/livewire.esm.
      - name: Setup PHP + Node + build assets
        env:
          NODE_VERSION: ${{ inputs.node-version }}
        run: |
          set -e

          # composer install laeuft in einem echten php:8.4-cli-Container,
          # NICHT per apt auf dem Runner-Host. Grund: der Runner-Host ist
          # Ubuntu 20.04 Focal (EOL) und bietet in den Standard-Repos nur
          # PHP 7.4 -- composer install brach damit mit "Refusing to parse
          # phar on PHP < 8.0" ab. Ein zwischenzeitlicher Versuch mit Ondrej
          # Surys PPA/Sury-Repo ist ebenfalls gescheitert: Sury bedient nur
          # Debian, und die Launchpad-PPA (ppa:ondrej/php) liefert fuer
          # "focal" nur noch die InRelease-Metadatei, die eigentliche
          # Packages-Datei 404et (Support fuer Focal eingestellt), beides
          # live verifiziert am 2026-09-07. Der Tests-Job dieses Workflows
          # loest exakt dasselbe Problem schon erfolgreich ueber
          # `container: image: php:8.4-cli` -- hier dieselbe Idee, nur als
          # einzelner `docker run`-Schritt statt Job-Container, weil
          # spaetere Schritte (SSH-Deploy) auf dem Host laufen muessen.
          docker run --rm -v "$PWD":/app -w /app php:8.4-cli sh -c '
            set -e
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends unzip git ca-certificates curl >/dev/null
            curl -sS https://getcomposer.org/installer -o /tmp/composer-setup.php
            HASH="$(curl -sS https://composer.github.io/installer.sig)"
            php -r "if (hash_file(\"sha384\",\"/tmp/composer-setup.php\") !== \"$HASH\") { exit(1); }"
            php /tmp/composer-setup.php --install-dir=/usr/local/bin --filename=composer
            php -v | head -1; composer --version
            composer install --no-dev --no-interaction --prefer-dist --no-progress --no-scripts --ignore-platform-reqs
          '

          # Node/npm kommen aus einem node-Container, NICHT vom Runner-Image.
          # Grund: myoung34/github-runner:latest wurde am 2026-11-09 auf Ubuntu
          # 26.04 umgestellt und liefert nodejs ohne npm; der frueher hier
          # stehende Fallback (`command -v npm` + NodeSource) installierte nichts,
          # weil apt das vorhandene Ubuntu-nodejs behielt -> "npm: command not
          # found". Gleiches Muster wie beim composer-Schritt oben.
          docker run --rm -v "$PWD":/app -w /app "node:${NODE_VERSION}" sh -c '
            set -e
            node -v; npm -v
            npm ci && npm run build
          '

      - name: Create staging dir on server
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: 46.224.6.69
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 30s
          command_timeout: 2m
          script: mkdir -p ${{ env.STAGING_DIR }}/resources/views ${{ env.STAGING_DIR }}/lang ${{ env.STAGING_DIR }}/public/build

      - name: Upload views
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -az --delete
          path: resources/views/
          remote_path: ${{ env.STAGING_DIR }}/resources/views/
          remote_host: 46.224.6.69
          remote_user: root
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}

      # lang/ — translation files (lang/de/*.php, lang/en/*.php). Same class as
      # views: no code, no CMS input, so --delete is safe. Without this, text
      # changes in lang/ are classified as quick-deployable but never reach the
      # container (they only land on the next full image build).
      # Only some projects have a lang/ dir — guard so projects without one
      # (most) don't fail the rsync step on a missing source path.
      - name: Check for lang directory
        id: has-lang
        run: |
          if [ -d lang ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload lang
        if: steps.has-lang.outputs.exists == 'true'
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -az --delete
          path: lang/
          remote_path: ${{ env.STAGING_DIR }}/lang/
          remote_host: 46.224.6.69
          remote_user: root
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Upload built assets
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -az --delete
          path: public/build/
          remote_path: ${{ env.STAGING_DIR }}/public/build/
          remote_host: 46.224.6.69
          remote_user: root
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}

      # public/images/ — only some projects track this dir in git (master-admin does
      # not). rsync without an existing source path fails the whole quick deploy, so
      # guard it like lang/.
      - name: Check for public/images directory
        id: has-images
        run: |
          if [ -d public/images ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # public/images/ — additive sync (NO --delete: images may also be
      # uploaded via admin/CMS at runtime; we must not wipe those).
      - name: Upload public images
        if: steps.has-images.outputs.exists == 'true'
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -az
          path: public/images/
          remote_path: ${{ env.STAGING_DIR }}/public/images/
          remote_host: 46.224.6.69
          remote_user: root
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Apply + clear caches
        uses: appleboy/ssh-action@v1.2.5
        env:
          OPCACHE_RESET_URL: ${{ inputs.opcache-reset-url }}
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          HAS_IMAGES: ${{ steps.has-images.outputs.exists }}
          EXPECTED_BASE: ${{ needs.detect-changes.outputs.base }}
        with:
          host: 46.224.6.69
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # OPCACHE_RESET_URL + DEPLOY_TOKEN via envs (NOT interpolated into the
          # script string) so the token never lands in the command line / logs.
          envs: OPCACHE_RESET_URL,DEPLOY_TOKEN,HAS_IMAGES,EXPECTED_BASE
          timeout: 30s
          command_timeout: 5m
          script: |
            set -e
            CONTAINER="${{ inputs.app-container }}"
            VOLUME="${{ inputs.public-volume-path }}"
            BASIS_FILE="${{ inputs.deploy-path }}/.quick-deploy-basis"

            # Sperre je Pfad (flock auf <pfad>/.deploy.lock, util-linux): der gesamte schreibende
            # Teil läuft nie parallel zu einem anderen Quick- oder Full-Deploy desselben Pfads,
            # auch dann nicht, wenn GitHub einen Lauf abbricht und dessen ssh-Prozess am Ziel
            # weiterläuft (er hält die Sperre bis zu seinem Ende). Die Sperre hält ein eigener
            # Hilfsprozess, der endet, sobald dieses Skript endet. So erbt kein Kindprozess des
            # Skripts (auch nicht aus pre-/post-deploy-commands) die Sperre. Ein zweiter Lauf
            # wartet mit Frist und scheitert danach laut.
            acquire_deploy_lock() { # pfad frist-in-sekunden
              local lp="$1" wait_s="$2" ok_dir ok holder ticks=0 max_ticks
              # Rückmeldung des Hilfsprozesses in einem privaten Verzeichnis (0700), das
              # bestehen bleibt, bis die Sperre erhalten ist: kein vorgetäuschtes "gesperrt".
              ok_dir=$(mktemp -d) || { echo "::error::mktemp fehlgeschlagen, Deploy-Sperre nicht möglich. Nichts ausgerollt."; return 1; }
              ok="$ok_dir/gesperrt"
              flock -w "$wait_s" "$lp/.deploy.lock" sh -c 'echo gesperrt > "$1" || exit 1; while kill -0 "$2" 2>/dev/null; do sleep 1; done' sh "$ok" "$$" >/dev/null 2>&1 &
              holder=$!
              # Wartezeit begrenzt: Sperrfrist plus 30 Sekunden Reserve (5 Prüfungen je Sekunde)
              max_ticks=$(( (wait_s + 30) * 5 ))
              while [ ! -s "$ok" ]; do
                if ! kill -0 "$holder" 2>/dev/null && [ ! -s "$ok" ]; then
                  rmdir "$ok_dir" 2>/dev/null
                  echo "::error::Deploy-Sperre $lp/.deploy.lock nach $wait_s Sekunden nicht erhalten (anderer Deploy läuft noch). Nichts ausgerollt."
                  return 1
                fi
                ticks=$((ticks + 1))
                if [ "$ticks" -ge "$max_ticks" ]; then
                  kill "$holder" 2>/dev/null
                  rm -f "$ok"; rmdir "$ok_dir" 2>/dev/null
                  echo "::error::Deploy-Sperre $lp/.deploy.lock: keine Rückmeldung des Sperr-Hilfsprozesses innerhalb der Frist. Nichts ausgerollt."
                  return 1
                fi
                sleep 0.2
              done
              rm -f "$ok"; rmdir "$ok_dir"
            }
            if ! acquire_deploy_lock "${{ inputs.deploy-path }}" 120; then
              exit 1
            fi

            # Basis-Vermerk beanspruchen UND ungültig machen, BEVOR das Ziel verändert wird:
            # bricht dieser Lauf ab (cancel, Fehler), gilt kein veralteter Vermerk weiter,
            # und der nächste Deploy fällt auf Full-Deploy zurück. Das Umbenennen ist atomar:
            # hat ein anderer Deploy den Vermerk inzwischen gelöscht oder ersetzt (Stand am
            # Ziel nicht mehr der, auf dem detect-changes entschieden hat), bricht dieser
            # Quick-Deploy ab, ohne etwas zu verändern.
            rm -f "$BASIS_FILE".tmp.* "$BASIS_FILE.claimed"
            if ! mv "$BASIS_FILE" "$BASIS_FILE.claimed"; then
              echo "::error::Basis-Vermerk nicht mehr vorhanden, Stand am Ziel hat sich geändert. Nichts ausgerollt, nächster Deploy ist ein Full-Deploy."
              exit 1
            fi
            CLAIMED_BASE=$(head -n 1 "$BASIS_FILE.claimed" | tr -d '[:space:]')
            rm -f "$BASIS_FILE.claimed"
            if [ -z "$EXPECTED_BASE" ] || [ "$CLAIMED_BASE" != "$EXPECTED_BASE" ]; then
              echo "::error::Basis am Ziel ($CLAIMED_BASE) weicht von der Entscheidungsgrundlage ($EXPECTED_BASE) ab. Nichts ausgerollt, nächster Deploy ist ein Full-Deploy."
              exit 1
            fi

            docker cp ${{ env.STAGING_DIR }}/resources/views/. "$CONTAINER":/var/www/resources/views/
            if [ -d ${{ env.STAGING_DIR }}/lang ]; then
              docker cp ${{ env.STAGING_DIR }}/lang/. "$CONTAINER":/var/www/lang/
            fi
            if [ -n "$VOLUME" ]; then
              cp -r ${{ env.STAGING_DIR }}/public/build/. "$VOLUME/build/"
              # public/images/ — additive copy into the public volume so new
              # static images (e.g. /images/about/foo.jpg) reach nginx without
              # a full Docker rebuild. www-data inside the container is uid 82.
              if [ "$HAS_IMAGES" = "true" ] && [ -d ${{ env.STAGING_DIR }}/public/images ]; then
                mkdir -p "$VOLUME/images"
                cp -r ${{ env.STAGING_DIR }}/public/images/. "$VOLUME/images/"
                chown -R 82:82 "$VOLUME/images"
                find "$VOLUME/images" -type d -exec chmod 755 {} \;
                find "$VOLUME/images" -type f -exec chmod 644 {} \;
              fi
            fi
            docker exec "$CONTAINER" php artisan view:clear
            docker exec "$CONTAINER" php artisan config:clear
            docker exec "$CONTAINER" php artisan cache:clear
            # Views auf Disk neu kompilieren, damit der erste echte Request nicht
            # gegen einen leeren Cache läuft (und der OPcache-Reset unten sofort
            # den frischen Stand cachen kann).
            docker exec "$CONTAINER" php artisan view:cache || true

            # ── OPcache-Reset ──────────────────────────────────────────────────
            # Diese Images laufen mit opcache.validate_timestamps=Off: der FPM
            # behält kompilierte Blade-Views im RAM, bis der OPcache explizit
            # zurückgesetzt wird. `view:clear` (Disk) UND `kill -USR2` reichen NICHT
            # zuverlässig — ohne echten Reset serviert der Container nach einem
            # Quick-Deploy weiter den ALTEN Stand bis zum nächsten Container-Restart.
            # Zuverlässig: HTTP-Request auf eine token-geschützte Route, die
            # opcache_reset() im FPM-Worker-Kontext aufruft (CLI-opcache_reset wirkt
            # nicht auf FPM). kill -USR2 bleibt als Fallback, wenn keine URL gesetzt.
            RESET_OK=0
            RESET_FAILED=0
            if [ -n "$OPCACHE_RESET_URL" ] && [ -n "$DEPLOY_TOKEN" ]; then
              # Token per Header (nicht als Query-String → landet nicht in
              # nginx-/Proxy-Access-Logs). -H via env, nicht ins URL interpoliert.
              CODE=$(curl -s -o /tmp/opcache-reset.out -w "%{http_code}" \
                --max-time 15 -H "X-Deploy-Token: ${DEPLOY_TOKEN}" \
                "${OPCACHE_RESET_URL}" || echo "000")
              if [ "$CODE" = "200" ]; then
                echo "OPcache reset via HTTP ok: $(cat /tmp/opcache-reset.out)"
                RESET_OK=1
              else
                echo "WARN: OPcache-Reset-URL antwortete HTTP $CODE (Route/Token prüfen)"
              fi
              rm -f /tmp/opcache-reset.out
            fi
            if [ "$RESET_OK" = "0" ]; then
              echo "Fallback: kill -USR2 an FPM-Master"
              if ! docker exec --user root "$CONTAINER" kill -USR2 1; then
                RESET_FAILED=1
                echo "WARN: USR2 failed; consider docker compose restart"
              fi
            fi

            rm -rf "${{ env.STAGING_DIR }}"

            # Basis-Vermerk erst jetzt, nach vollständig erfolgreichem Ausrollen (set -e):
            # der nächste Quick-Deploy diffte gegen diesen Stand. Ohne geglückten
            # OPcache-Reset gilt der Stand nicht als ausgerollt (kein Vermerk, nächster
            # Deploy ist ein Full-Deploy). Atomar über eine laufbezogene .tmp-Datei.
            if [ "$RESET_FAILED" = "1" ]; then
              echo "WARN: Basis-Vermerk nicht geschrieben (OPcache-Reset fehlgeschlagen), nächster Deploy ist ein Full-Deploy"
            else
              BASIS_TMP="$BASIS_FILE.tmp.$$"
              printf '%s\n' "${{ github.sha }}" > "$BASIS_TMP"
              # ln schlägt fehl, wenn inzwischen ein anderer Deploy einen Vermerk geschrieben
              # hat (dessen Stand gilt dann, ein Quick-Deploy überschreibt nie einen Full-Deploy).
              if ln "$BASIS_TMP" "$BASIS_FILE"; then
                rm -f "$BASIS_TMP"
              else
                rm -f "$BASIS_TMP"
                echo "WARN: Basis-Vermerk von einem anderen Deploy gesetzt, bleibt bestehen"
              fi
            fi
            echo "Quick deploy done (Basis ${{ github.sha }})"

      # Staging-Verzeichnis dieses Laufs auch bei Fehler oder Abbruch entfernen
      # (sonst bleibt es in /tmp am Server liegen).
      - name: Remove staging dir on server
        if: always()
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: 46.224.6.69
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 30s
          command_timeout: 1m
          script: rm -rf "${{ env.STAGING_DIR }}"

  # ── Full Deploy: Docker build + push + restart ───────────────────────────────
  full-deploy:
    needs: detect-changes
    if: needs.detect-changes.outputs.quick == 'false'
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: nickheymann
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build-Platz holen
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/build-slot.sh" <<'BUILD_SLOT_SCRIPT'
          #!/bin/bash
          # Nach dem Build-Konflikt am 03.10.2026 begrenzen Containernamen parallele Builds.
          # Ein Platz verfällt nach 45 Minuten; beendete Container werden abgeräumt.

          slots=${BUILD_SLOTS:-2}
          prefix=${BUILD_SLOT_PREFIX:-hetzner-build-slot}
          max_wait=${BUILD_SLOT_MAX_WAIT:-2400}
          ttl=${BUILD_SLOT_TTL:-2700}
          owner_run=${GITHUB_RUN_ID:-}-${GITHUB_RUN_ATTEMPT:-}
          owner_job=${GITHUB_JOB:-}

          release() {
              [ -n "${BUILD_SLOT:-}" ] || return 0
              # Nach Prüfung nur die Container-ID löschen, damit ein Nachfolger sicher bleibt.
              info=$(docker inspect --format '{{.Id}} {{index .Config.Labels "run"}} {{index .Config.Labels "job"}}' "$BUILD_SLOT" 2>/dev/null) || return 0
              IFS=' ' read -r container_id run_label job_label <<EOF_INFO
          $info
          EOF_INFO
              if [ "$run_label" = "$owner_run" ] && [ "$job_label" = "$owner_job" ]; then
                  docker rm -f "$container_id" >/dev/null || echo "::warning::Build-Platz $BUILD_SLOT konnte nicht freigegeben werden."
              else
                  echo "Build-Platz $BUILD_SLOT gehört einem anderen Job und bleibt bestehen."
              fi
              return 0
          }

          show_holders() {
              i=1
              while [ "$i" -le "$slots" ]; do
                  holder=$(docker inspect --format '{{index .Config.Labels "repo"}} ({{index .Config.Labels "run"}} / {{index .Config.Labels "job"}})' "$prefix-$i" 2>/dev/null) || holder='frei oder nicht erreichbar'
                  echo "Build-Platz $prefix-$i: $holder"
                  i=$((i + 1))
              done
          }

          acquire() {
              for value in "$slots" "$max_wait" "$ttl"; do
                  case "$value" in
                      ''|*[!0-9]*) echo '::warning::Ungültige Build-Platz-Konfiguration, Build läuft ohne Platz weiter.'; return 0 ;;
                  esac
              done
              if [ "$slots" -eq 0 ] || [ "$ttl" -eq 0 ]; then
                  echo '::warning::Plätze und Verfallszeit müssen positiv sein, Build läuft ohne Platz weiter.'
                  return 0
              fi
              started=$(date +%s)
              next_log=$started
              failures=0
              while :; do
                  slot_index=1
                  while [ "$slot_index" -le "$slots" ]; do
                      slot="$prefix-$slot_index"
                      info=$(docker inspect --format '{{.Id}} {{.State.Running}}' "$slot" 2>/dev/null) || info=''
                      IFS=' ' read -r container_id running <<EOF_INFO
          $info
          EOF_INFO
                      if [ "$running" = 'false' ]; then
                          docker rm -f "$container_id" >/dev/null 2>&1 || echo "Build-Platz $slot wurde inzwischen verändert oder konnte nicht entfernt werden."
                      fi
                      if result=$(docker run -d --name "$slot" \
                          --label "repo=${GITHUB_REPOSITORY:-}" --label "run=$owner_run" \
                          --label "job=$owner_job" --restart no alpine:3.20 sleep "$ttl" 2>&1); then
                          if printf 'BUILD_SLOT=%s\n' "$slot" >> "$GITHUB_ENV"; then
                              echo "Build-Platz $slot übernommen."
                          else
                              BUILD_SLOT=$slot release
                              echo '::warning::Build-Platz konnte nicht gespeichert werden, Build läuft ohne Platz weiter.'
                          fi
                          return 0
                      fi
                      # Namenskonflikte sind normales Warten; Pull-/Daemonfehler zählen separat.
                      case "$result" in
                          *'Conflict.'*|*'is already in use'*) failures=0 ;;
                          *)
                              failures=$((failures + 1))
                              echo "Build-Platz $slot konnte nicht übernommen werden: $result"
                              if [ "$failures" -ge 3 ]; then
                                  echo '::warning::Drei Docker-Fehler in Folge, Build läuft ohne Platz weiter.'
                                  return 0
                              fi
                              ;;
                      esac
                      slot_index=$((slot_index + 1))
                  done
                  now=$(date +%s)
                  elapsed=$((now - started))
                  if [ "$elapsed" -ge "$max_wait" ]; then
                      echo "::warning::Nach $max_wait Sekunden kein Build-Platz frei, Build läuft ohne Platz weiter."
                      return 0
                  fi
                  if [ "$now" -ge "$next_log" ]; then
                      show_holders
                      next_log=$((now + 60))
                  fi
                  delay=$((max_wait - elapsed))
                  [ "$delay" -le 10 ] || delay=10
                  sleep "$delay"
              done
          }

          case "${1:-}" in
              acquire) acquire ;;
              release) release ;;
              *) echo 'Verwendung: build-slot.sh acquire|release' >&2; exit 2 ;;
          esac
          BUILD_SLOT_SCRIPT
          bash "$RUNNER_TEMP/build-slot.sh" acquire

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ inputs.docker-context }}
          push: true
          tags: |
            ghcr.io/${{ inputs.image-name }}:latest
            ghcr.io/${{ inputs.image-name }}:${{ github.sha }}
          # Revision im Image: der Basis-Vermerk nach dem Deploy wird aus diesem Label des
          # tatsächlich gestarteten Containers gelesen, nicht aus github.sha (sonst könnte
          # ein :latest eines anderen, abgebrochenen Laufs unter fremdem SHA verbucht werden).
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          # Cache via a per-image GHCR tag, NOT type=gha. On the self-hosted
          # Hetzner runner type=gha round-trips every layer (mode=max) to
          # GitHub's cache service over the public internet — slow, and wasteful
          # since the runner builds on the same host it deploys to. A registry
          # cache tag lives in GHCR (local network for the runner) and is pulled
          # layer-by-layer, so an unchanged base/deps stage is reused instantly.
          cache-from: type=registry,ref=ghcr.io/${{ inputs.image-name }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ inputs.image-name }}:buildcache,mode=max

      - name: Build-Platz freigeben
        if: always()
        shell: bash
        run: |
          if [ -n "${BUILD_SLOT:-}" ] && [ -f "$RUNNER_TEMP/build-slot.sh" ]; then
            bash "$RUNNER_TEMP/build-slot.sh" release
          fi

      - name: Deploy to Hetzner
        uses: appleboy/ssh-action@v1.2.5
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          EXPECTED_BASE: ${{ needs.detect-changes.outputs.base }}
        with:
          host: 46.224.6.69
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GHCR_TOKEN,EXPECTED_BASE
          timeout: 30s
          command_timeout: 15m
          script: |
            set -euo pipefail

            echo "$GHCR_TOKEN" | docker login ghcr.io -u nickheymann --password-stdin

            # Compose-Start: Zustandsdienste (Redis, Datenbanken, ...) nie zwangsweise
            # neu erzeugen, sonst verlieren Queue-Worker und Scheduler waehrend des
            # Neustarts ihre Verbindung. Der Nutzwert von --force-recreate (frische
            # env_file/Mount-Inhalte, neues :latest) betrifft nur die Anwendungsdienste.
            STATEFUL_SERVICES="${{ inputs.stateful-services }}"
            STATEFUL_NORM=$(printf '%s' "$STATEFUL_SERVICES" | tr ',\n\r\t' '    ')
            if ! [[ "$STATEFUL_NORM" =~ ^[A-Za-z0-9_.\ -]*$ ]]; then
              echo "::error::stateful-services enthaelt ungueltige Zeichen"
              exit 1
            fi
            compose_up() {
              local svc s keep="" app="" all
              # Zuweisung getrennt, damit ein Fehler von compose config (set -e) den Deploy
              # abbricht statt mit leerer Dienstliste still nichts zu tun.
              all=$(docker compose config --services </dev/null)
              if [ -z "$all" ]; then
                echo "::error::docker compose config --services lieferte keine Dienste"
                exit 1
              fi
              for svc in $all; do
                local is_stateful=0
                for s in $STATEFUL_NORM; do
                  if [ "$s" = "$svc" ]; then is_stateful=1; fi
                done
                if [ "$is_stateful" = 1 ]; then keep="$keep $svc"; else app="$app $svc"; fi
              done
              echo "Zustandsdienste (kein Zwangs-Neustart):${keep:- keine}"
              echo "Anwendungsdienste (--force-recreate):${app:- keine}"
              # 1) Zustandsdienste: Compose erzeugt nur bei geaendertem Image oder
              #    geaenderter Konfiguration neu, fehlende Dienste werden gestartet.
              #    --wait (laufend, mit Healthcheck gesund) ersetzt die Bereitschaft, die
              #    --no-deps unten ueberspringt (depends_on: condition: service_healthy).
              if [ -n "$keep" ]; then
                timeout 300 docker compose up -d --wait $keep </dev/null
              fi
              # 2) Anwendungsdienste wie bisher zwangsweise neu, ohne Abhaengigkeiten.
              if [ -n "$app" ]; then
                docker compose up -d --force-recreate --no-deps $app </dev/null
              fi
            }

            # Sperre je Pfad (flock auf <pfad>/.deploy.lock, util-linux): der gesamte schreibende
            # Teil läuft nie parallel zu einem anderen Quick- oder Full-Deploy desselben Pfads,
            # auch dann nicht, wenn GitHub einen Lauf abbricht und dessen ssh-Prozess am Ziel
            # weiterläuft (er hält die Sperre bis zu seinem Ende). Die Sperre hält ein eigener
            # Hilfsprozess, der endet, sobald dieses Skript endet. So erbt kein Kindprozess des
            # Skripts (auch nicht aus pre-/post-deploy-commands) die Sperre. Ein zweiter Lauf
            # wartet mit Frist und scheitert danach laut.
            acquire_deploy_lock() { # pfad frist-in-sekunden
              local lp="$1" wait_s="$2" ok_dir ok holder ticks=0 max_ticks
              # Rückmeldung des Hilfsprozesses in einem privaten Verzeichnis (0700), das
              # bestehen bleibt, bis die Sperre erhalten ist: kein vorgetäuschtes "gesperrt".
              ok_dir=$(mktemp -d) || { echo "::error::mktemp fehlgeschlagen, Deploy-Sperre nicht möglich. Nichts ausgerollt."; return 1; }
              ok="$ok_dir/gesperrt"
              flock -w "$wait_s" "$lp/.deploy.lock" sh -c 'echo gesperrt > "$1" || exit 1; while kill -0 "$2" 2>/dev/null; do sleep 1; done' sh "$ok" "$$" >/dev/null 2>&1 &
              holder=$!
              # Wartezeit begrenzt: Sperrfrist plus 30 Sekunden Reserve (5 Prüfungen je Sekunde)
              max_ticks=$(( (wait_s + 30) * 5 ))
              while [ ! -s "$ok" ]; do
                if ! kill -0 "$holder" 2>/dev/null && [ ! -s "$ok" ]; then
                  rmdir "$ok_dir" 2>/dev/null
                  echo "::error::Deploy-Sperre $lp/.deploy.lock nach $wait_s Sekunden nicht erhalten (anderer Deploy läuft noch). Nichts ausgerollt."
                  return 1
                fi
                ticks=$((ticks + 1))
                if [ "$ticks" -ge "$max_ticks" ]; then
                  kill "$holder" 2>/dev/null
                  rm -f "$ok"; rmdir "$ok_dir" 2>/dev/null
                  echo "::error::Deploy-Sperre $lp/.deploy.lock: keine Rückmeldung des Sperr-Hilfsprozesses innerhalb der Frist. Nichts ausgerollt."
                  return 1
                fi
                sleep 0.2
              done
              rm -f "$ok"; rmdir "$ok_dir"
            }

            cd "${{ inputs.deploy-path }}"

            # Basis-Vermerk ungültig machen, BEVOR das Ziel verändert wird (nur bei Repos
            # mit Quick-Deploy). Er wird erst nach vollständigem Erfolg neu geschrieben;
            # bricht der Deploy dazwischen ab, fällt der nächste Lauf auf Full-Deploy zurück.
            if [ -n "${{ inputs.app-container }}" ]; then
              # Sperre für den Hauptpfad UND alle Extra-Pfade, damit auch dort kein Quick- oder
              # Full-Deploy parallel läuft. Die Pfade werden sortiert gesperrt (einheitliche
              # Reihenfolge, kein Verklemmen zweier Läufe mit vertauschten Haupt- und Extra-Pfaden).
              LOCK_PATHS=$(printf '%s\n%s\n' "${{ inputs.deploy-path }}" "${{ inputs.extra-deploy-paths }}" | xargs -n1 | LC_ALL=C sort -u)
              for lock_path in $LOCK_PATHS; do
                if ! acquire_deploy_lock "$lock_path" 300; then
                  exit 1
                fi
              done
              # Entscheidungsbasis unter der Sperre erneut prüfen: hat inzwischen ein anderer Lauf
              # (z. B. ein am Server weiterlaufender abgebrochener Deploy) einen anderen Stand
              # ausgerollt als der, auf dem detect-changes entschieden hat, nicht überschreiben.
              CUR_BASIS=""
              if [ -f "${{ inputs.deploy-path }}/.quick-deploy-basis" ]; then
                CUR_BASIS=$(head -n 1 "${{ inputs.deploy-path }}/.quick-deploy-basis" | tr -d '[:space:]')
              fi
              if printf '%s' "$CUR_BASIS" | grep -qE '^[0-9a-f]{40}$' && [ "$CUR_BASIS" != "${EXPECTED_BASE:-}" ]; then
                echo "::error::Abbruch: Der Basis-Vermerk am Ziel ($CUR_BASIS) hat sich seit der Prüfung geändert (erwartet: ${EXPECTED_BASE:-keiner}). Ein anderer Deploy war dazwischen. Nichts ausgerollt. Lauf wiederholen."
                exit 1
              fi
              rm -f "${{ inputs.deploy-path }}/.quick-deploy-basis" "${{ inputs.deploy-path }}/.quick-deploy-basis".tmp.*
            fi
            # Extra-Pfade bekommen ebenfalls neuen Code: ein eigener Vermerk dort (der Pfad
            # kann auch Hauptpfad eines anderen Deploys sein) darf nicht gültig bleiben.
            printf '%s\n' "${{ inputs.extra-deploy-paths }}" | while IFS= read -r extra; do
              extra=$(echo "$extra" | xargs)
              if [ -n "$extra" ]; then
                rm -f "$extra/.quick-deploy-basis" "$extra"/.quick-deploy-basis.tmp.*
              fi
            done

            docker compose pull

            # Pre-deploy commands (e.g. migrations before up)
            ${{ inputs.pre-deploy-commands }}

            compose_up

            # Post-deploy commands (cache, health check, etc.)
            ${{ inputs.post-deploy-commands }}

            # Deploy extra paths (e.g. staging) if specified
            EXTRA_PATHS="${{ inputs.extra-deploy-paths }}"
            if [ -n "$EXTRA_PATHS" ]; then
              echo "$EXTRA_PATHS" | while IFS= read -r path; do
                path=$(echo "$path" | xargs)
                if [ -n "$path" ]; then
                  echo "Deploying to extra path: $path"
                  cd "$path"
                  docker compose pull
                  compose_up
                fi
              done
            fi

            # Basis-Vermerk erst nach erfolgreichem Ausrollen (set -euo pipefail, alle
            # Pfade): der nächste Quick-Deploy diffte gegen diesen Stand und fällt auf
            # Full-Deploy zurück, wenn er fehlt. Der Wert ist die Revision aus dem Label
            # des laufenden App-Containers (an das tatsächlich gestartete Image gebunden),
            # nicht github.sha; fehlt oder ungültig, bleibt der Vermerk weg (fail closed).
            # Atomar über eine laufbezogene .tmp-Datei. Nur bei Repos mit Quick-Deploy.
            if [ -n "${{ inputs.app-container }}" ]; then
              if ! REVISION=$(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "${{ inputs.app-container }}"); then
                REVISION=""
              fi
              if printf '%s' "$REVISION" | grep -qE '^[0-9a-f]{40}$'; then
                BASIS_TMP="${{ inputs.deploy-path }}/.quick-deploy-basis.tmp.$$"
                printf '%s\n' "$REVISION" > "$BASIS_TMP"
                mv "$BASIS_TMP" "${{ inputs.deploy-path }}/.quick-deploy-basis"
                echo "Basis-Vermerk: $REVISION"
              else
                echo "::warning::Image-Revision des Containers ${{ inputs.app-container }} nicht lesbar, kein Basis-Vermerk (nächster Deploy ist ein Full-Deploy)"
              fi
            fi

            # Cleanup old images (skip recently used to avoid race with concurrent deploys)
            docker image prune -f --filter "until=1h"
